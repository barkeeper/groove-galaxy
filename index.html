<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net blob:;
    worker-src 'self' blob:;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com data:;
    img-src 'self' data: blob:;
    media-src 'self' blob:;
    connect-src 'self' https://cdn.jsdelivr.net data: blob:;
    manifest-src 'self';
    base-uri 'self';
  " />
  <title>Groove Galaxy</title>
  <meta name="description" content="A dancing 3D character that grooves to a set list of tracks — runs entirely in your browser." />
  <meta name="theme-color" content="#0a0b0d" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="./icons/icon-192.png" sizes="192x192" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=block" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
<header class="bar">
  <div class="brand">
    <div class="sigil" aria-hidden="true">踊</div>
    <div class="brandtext">
      <h1>GROOVE GALAXY</h1>
      <p class="sub">dance floor</p>
    </div>
  </div>

  <div class="controls">
    <button class="iconbtn" id="installBtn" title="Install app" aria-label="Install" hidden><span class="material-symbols-outlined">install_mobile</span></button>
    <div class="volume">
      <button class="iconbtn" id="muteBtn" title="Mute music" aria-label="Mute music"><span class="material-symbols-outlined muteglyph">volume_up</span></button>
      <input type="range" id="volume" class="vol" min="0" max="100" step="1" value="50" aria-label="Music volume" title="Volume" />
    </div>
    <button class="iconbtn" id="themeBtn" title="Toggle dark / light" aria-label="Toggle theme"><span class="material-symbols-outlined">dark_mode</span></button>
  </div>
</header>

<main class="stage">
  <section class="panel viewport">
    <video id="floor" class="floor" muted loop playsinline preload="auto" aria-hidden="true"></video>
    <canvas id="face"></canvas>
    <div class="hud">
      <div class="hud__top">
        <div class="nowplaying" id="nowplaying" data-active="false">
          <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span id="npText">idle</span>
        </div>
      </div>
      <div class="hud__bottom">
        <canvas id="wave" class="wave"></canvas>
      </div>
    </div>
    <div class="viewport__fallback" id="faceFallback" hidden></div>
  </section>

  <div class="rightcol">
    <section class="panel setlist">
      <div class="setlist__head">
        <h2>Set List</h2>
      </div>
      <ul class="tracks" id="tracks" aria-label="Dances"></ul>
    </section>

    <section class="panel floorpick">
      <div class="setlist__head">
        <h2>Dance Floor</h2>
      </div>
      <ul class="floors" id="floors" aria-label="Dance floor backgrounds"></ul>
    </section>
  </div>
</main>

<script>
(async () => {
  const selfScript = document.currentScript;
  document.documentElement.setAttribute('data-theme', localStorage.getItem('groove.theme') || 'dark');

  // WEB-only: three.js + three-vrm load from the CDN; the VRM + music are same-origin.
  const CDN = {
    three:   'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js',
    addons:  'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/',
    vrm:     'https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.4.5/lib/three-vrm.module.min.js',
    vrmAnim: 'https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3.4.5/lib/three-vrm-animation.module.min.js',
    face:    './assets/avatar.vrm',
  };
  window.__GROOVE__ = { assets: CDN };

  const im = document.createElement('script');
  im.type = 'importmap';
  im.textContent = JSON.stringify({ imports: {
    'three': CDN.three, 'three/addons/': CDN.addons,
    '@pixiv/three-vrm': CDN.vrm, '@pixiv/three-vrm-animation': CDN.vrmAnim,
  } });
  selfScript.after(im);

  const app = document.createElement('script');
  app.type = 'module'; app.src = './app.js';
  im.after(app);

  if ('serviceWorker' in navigator) {
    try { await navigator.serviceWorker.register('./sw.js'); } catch (e) { console.warn('SW register failed', e); }
  }
})();
</script>
</body>
</html>
